[package]
name = "medusa-l1"
version = "0.1.0"
edition = "2024"

# Phase-1 Bedrock L1 client for the Medusa wallet: node-side custody only. Talks
# plain HTTP(S) to a logos-blockchain node's REST API through the REAL pinned
# client crates (same git rev the LEZ tree in wallet/.lez-build pins), so the
# wire format is guaranteed compatible. No zone/sequencer code, no local keys.

[[bin]]
name = "medusa-l1"
path = "src/main.rs"

[dependencies]
# The pinned logos-blockchain client crates, exactly as LEZ pins them
# (wallet/.lez-build/Cargo.toml). Keep the rev in lockstep with that file.
logos-blockchain-common-http-client = { git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "d8711bbc3d43d3ef9755ef9b73af32fd0f703160" }
logos-blockchain-core = { git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "d8711bbc3d43d3ef9755ef9b73af32fd0f703160" }
logos-blockchain-http-api-common = { git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "d8711bbc3d43d3ef9755ef9b73af32fd0f703160" }
logos-blockchain-key-management-system-keys = { git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "d8711bbc3d43d3ef9755ef9b73af32fd0f703160" }
logos-blockchain-groth16 = { git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "d8711bbc3d43d3ef9755ef9b73af32fd0f703160" }

anyhow = "1.0.98"
base58 = "0.2.0"
borsh = { version = "1.5.7", features = ["derive"] }
clap = { version = "4.5.42", features = ["derive"] }
hex = "0.4.3"
# Only to hand CommonHttpClient::new_with_client a Client that has a per-request
# timeout. default-features = false matches how logos-blockchain itself pins
# reqwest, so this adds no feature that is not already enabled.
reqwest = { version = "0.12.28", default-features = false }
serde_json = "1.0.81"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.4"

# Standalone crate: never attach to an enclosing workspace.
[workspace]
