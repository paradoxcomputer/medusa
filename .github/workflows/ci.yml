# Minimal CI: the two suites that run anywhere (no Qt, no chain, no proofs).
# The C++ plugin suite needs the Logos SDK + Qt dev env and is not wired here yet.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` is pinned to a full commit sha with the tag in a trailing comment: a major
      # tag like @v4 is a mutable ref the owning org can force-move. Dependabot updates shas.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: SDK self-test (mock bridge, incl. requestZone + token guards)
        run: node sdk/medusa-connect.test.js
      - name: Wrapper syntax
        run: python3 -m py_compile module/scripts/wallet-wrapper
      - name: Wrapper suite (fake wallet-lez, verified on-chain rules)
        run: python3 module/tests/wrapper_test.py
