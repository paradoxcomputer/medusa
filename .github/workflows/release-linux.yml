# Build the SELF-CONTAINED linux-amd64 Medusa apps (.lgx) in CI.
#
# The linux counterpart of release-macos.yml. Until now the linux .lgx was only ever produced
# by running module/scripts/make-release.sh by hand on a machine with Nix + Rust, which meant a
# release could not be cut without that machine. This builds the same artifacts on a GitHub
# runner so a tag produces BOTH variants.
#
# Output: a self-contained `linux-amd64` medusa_core (engine + sequencers + Tor + Tor-forward
# bundled under bin/) plus medusa_ui + tip_jar. These are merged with the darwin .lgx into the
# multi-variant packages served by the module catalog.
#
# Trigger: a release tag (v*) or manual dispatch, matching release-macos.yml.
name: release-linux

on:
  push:
    # "publish-<version>" re-runs just this job (mac is v* only), so the merge+upload step
    # below can be redone without paying for another macOS build.
    tags: ["v*", "publish-*"]
  workflow_dispatch:

permissions:
  contents: write   # upload the finished .lgx to the release
  actions: read     # pull the darwin artifact from the release-macos run

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: linux-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tags, for a reproducible engine build

      - name: Install Nix (flakes)
        uses: DeterminateSystems/nix-installer-action@main

      # cargo-risczero is a ~30 minute source build, which dominated the first run's wall clock.
      # Cache the resulting binaries so retries start at the part that matters.
      - name: Cache risc0 toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-risczero
            ~/.cargo/bin/r0vm
          key: risc0-${{ runner.os }}-cargo-risczero

      - name: Rust toolchain (+ risc0)
        run: |
          rustup default stable || true
          # The LEZ wallet builds risc0 guest programs - install the zkVM toolchain.
          # (If the crate vendors/pins its own, this is a harmless no-op.)
          command -v cargo-risczero >/dev/null || cargo install cargo-risczero || true
          cargo risczero install || true

      - name: Build the LEZ engine (patched v0.2.0 source)
        run: |
          # wallet/build.sh replays the patch series with `git am`, which refuses to run without a
          # committer identity. GitHub's ubuntu image ships none, so set one for this checkout.
          git config --global user.name  "medusa build"
          git config --global user.email "build@medusa.local"
          # clones logos-execution-zone@v0.2.0, applies wallet/patches-v020/*, builds:
          #   wallet (→ wallet-lez), sequencer_service (standalone), sequencer_service_l1 (L1),
          #   diaphani-forward (Tor forwarder).
          # patches-v020/0002 keeps the `keycard` cargo feature OFF, so the wallet links no
          # libpython - see the linkage assertion below.
          bash wallet/build.sh
          echo "LEZ=$PWD/wallet/.lez-build/target/release"     >> "$GITHUB_ENV"
          echo "DIA=$PWD/wallet/.diaphani-build/target/release" >> "$GITHUB_ENV"

      - name: Assert the engine has no build-host Python dependency
        run: |
          set -euo pipefail
          # medusa#1: wallet-lez used to link the build host's libpython and died at load time
          # on every other machine. Fail the build here rather than shipping that again.
          for b in wallet sequencer_service sequencer_service_l1; do
            out=$(readelf -d "$LEZ/$b" || true)
            case "$out" in
              *libpython*) echo "ERROR: $b links libpython - keycard feature leaked back in"; exit 1 ;;
            esac
          done
          echo "ok: no libpython in the engine binaries"

      - name: Build module .lgx (native linux, self-contained .so)
        run: |
          set -euo pipefail
          out="$PWD/lin-out"; mkdir -p "$out"
          ( cd module                   && nix build .#lgx-portable -o result-portable ); cp module/result-portable/*.lgx                   "$out/medusa_core.lgx"
          ( cd module/plugins/medusa_ui && nix build .#lgx-portable -o result-portable ); cp module/plugins/medusa_ui/result-portable/*.lgx "$out/medusa_ui.lgx"
          ( cd examples/tip-jar         && nix build .#lgx-portable -o result-portable ); cp examples/tip-jar/result-portable/*.lgx         "$out/tip_jar.lgx"
          echo "LINOUT=$out" >> "$GITHUB_ENV"

      - name: Obtain the lgx CLI (built as a nix dep; pin against GC)
        run: |
          drv=$(ls -t /nix/store/*-lgx-0.1.0.drv | grep -vE 'logos|module' | head -1)
          nix-store --realise "$drv" --add-root "$PWD/lgx-cli" >/dev/null
          echo "LGX=$PWD/lgx-cli/bin/lgx" >> "$GITHUB_ENV"

      - name: Bundle the engine into every linux variant of medusa_core
        run: |
          set -euo pipefail
          mc="$LINOUT/medusa_core.lgx"
          cp "$mc" medusa_core-selfcontained.lgx; chmod u+w medusa_core-selfcontained.lgx

          # Bundle Tor once so the Paradox·Tor zone works with no external install
          # (make-release.sh does the same). Non-fatal: resolveTorBin falls back to a system tor.
          sudo apt-get update -qq && sudo apt-get install -y -qq tor || true
          tor_bin="$(command -v tor || true)"

          # Every linux variant the nix build emitted, not just linux-amd64. The Nix DEV build of
          # Basecamp only loads "-dev" variants (see module/scripts/install-dev.sh), so bundling
          # the engine into linux-amd64 alone would ship those users a plugin with no engine
          # under bin/ and every wallet op would fail "wallet CLI not found".
          variants=$(python3 - "$mc" <<'PY'
          import sys,gzip,io,tarfile
          tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()))
          vs={p[1] for p in (m.name.split('/') for m in tf.getmembers())
              if len(p) > 2 and p[0] == 'variants' and p[1].startswith('linux-')}
          print('\n'.join(sorted(vs)))
          PY
          )
          [ -n "$variants" ] || { echo "ERROR: no linux variants found in $mc"; exit 1; }
          echo "bundling engine into:" $variants

          for v in $variants; do
            stg="$PWD/mc-stage-$v"; mkdir -p "$stg/bin"
            # extract this variant's payload (the .so + its bundled libs)
            python3 - "$mc" "$stg" "$v" <<'PY'
          import sys,gzip,io,tarfile,os
          src,stg,var=sys.argv[1],sys.argv[2],sys.argv[3]; pre=f"variants/{var}/"
          tf=tarfile.open(fileobj=io.BytesIO(gzip.open(src,'rb').read()))
          for m in tf.getmembers():
              if m.name.startswith(pre) and not m.isdir():
                  dst=os.path.join(stg,m.name[len(pre):]); os.makedirs(os.path.dirname(dst) or '.',exist_ok=True)
                  open(dst,'wb').write(tf.extractfile(m).read())
          PY
            # engine binaries under bin/ (resolveBin looks at <module>/bin/<name> first):
            install -m755 "$LEZ/wallet"                     "$stg/bin/wallet-lez"
            install -m755 module/scripts/wallet-wrapper      "$stg/bin/wallet"
            install -m755 "$LEZ/sequencer_service"           "$stg/bin/sequencer_service"
            install -m755 "$LEZ/sequencer_service_l1"        "$stg/bin/sequencer_service_l1"
            install -m755 "$DIA/diaphani-forward"            "$stg/bin/diaphani-forward" || true
            install -m755 module/scripts/medusa-tor-monitor  "$stg/bin/medusa-tor-monitor"
            if [ -n "$tor_bin" ]; then install -m755 "$(readlink -f "$tor_bin")" "$stg/bin/medusa-tor"; fi
            mainfile=$(basename "$(ls "$stg"/*.so 2>/dev/null || ls "$stg"/*plugin* | head -1)")
            "$LGX" add medusa_core-selfcontained.lgx -v "$v" -f "$stg" --main "$mainfile" -y
          done
          "$LGX" verify medusa_core-selfcontained.lgx

          # Guard the regression this step exists to prevent: every linux variant must carry the
          # engine, or a whole class of Basecamp install silently gets a wallet-less module.
          python3 - medusa_core-selfcontained.lgx <<'PY'
          import sys,gzip,io,tarfile
          tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()))
          names=[m.name for m in tf.getmembers()]
          vs={n.split('/')[1] for n in names
              if n.startswith('variants/') and len(n.split('/')) > 2 and n.split('/')[1].startswith('linux-')}
          bad=[v for v in vs if f"variants/{v}/bin/wallet-lez" not in names]
          if bad:
              sys.exit("ERROR: linux variants missing bin/wallet-lez: %s" % ", ".join(sorted(bad)))
          print("ok: engine bundled into", ", ".join(sorted(vs)))
          PY

      - name: Collect artifacts
        run: |
          dst="$PWD/artifacts"; mkdir -p "$dst"
          cp medusa_core-selfcontained.lgx "$dst/medusa_core-${{ matrix.variant }}.lgx"
          cp "$LINOUT"/medusa_ui.lgx "$dst/medusa_ui-${{ matrix.variant }}.lgx"
          cp "$LINOUT"/tip_jar.lgx   "$dst/tip_jar-${{ matrix.variant }}.lgx"
          ls -la "$dst"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-lgx-${{ matrix.variant }}
          path: artifacts/*.lgx

      # Merge with the darwin build and publish, so a release needs no local tooling. The linux
      # runner already has the lgx CLI from the step above, and macOS cannot be built here, so
      # this side does the merge: pull the newest successful release-macos artifact, merge each
      # package into one multi-variant .lgx, and attach it to the release.
      - name: Merge with darwin and attach the .lgx to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json;print(json.load(open('module/modules/medusa_core/manifest.json'))['version'])")
          tag="v$ver"
          echo "release tag: $tag"

          mac_run=$(gh run list --workflow release-macos.yml --status success \
                      --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -z "$mac_run" ]; then
            echo "::warning::no successful release-macos run found - publishing linux-only packages"
          else
            echo "merging with darwin artifacts from run $mac_run"
            mkdir -p macdl && gh run download "$mac_run" -D macdl
          fi

          # lgx merge requires every manifest field except `main` to match, so a darwin artifact
          # from an older release cannot be merged into this one. Detect that here and say so,
          # rather than letting merge fail with a field-by-field diff.
          macver=""
          if [ -n "$mac_run" ]; then
            maccore=$(find macdl -name "medusa_core-darwin-*.lgx" | head -1 || true)
            if [ -n "$maccore" ]; then
              macver=$(python3 -c "import sys,gzip,io,tarfile,json;tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()));print(json.load(tf.extractfile('manifest.json'))['version'])" "$maccore")
              echo "darwin artifact version: $macver (this build: $ver)"
              if [ "$macver" != "$ver" ]; then
                echo "::error::darwin artifacts are v$macver but this build is v$ver."
                echo "::error::Push tag v$ver to rebuild macOS, then re-run this workflow."
                exit 1
              fi
            fi
          fi

          mkdir -p publish
          for pkg in medusa_core medusa_ui tip_jar; do
            lin="artifacts/$pkg-${{ matrix.variant }}.lgx"
            [ -f "$lin" ] || { echo "::warning::$lin missing, skipping"; continue; }
            mac=$(find macdl -name "$pkg-darwin-*.lgx" 2>/dev/null | head -1 || true)
            # name each file after ITS OWN manifest version, so the catalog's generated index
            # never advertises a version that disagrees with the package it points at
            pkgver=$(python3 -c "import sys,gzip,io,tarfile,json;tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()));print(json.load(tf.extractfile('manifest.json'))['version'])" "$lin")
            out="publish/$pkg-$pkgver.lgx"
            if [ -n "$mac" ]; then
              "$LGX" merge "$lin" "$mac" -o "$out" -y
            else
              cp "$lin" "$out"
            fi
            "$LGX" verify "$out"
          done
          ls -la publish

          # Create the release if it does not exist yet, so cutting one needs no manual step.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "creating release $tag"
            gh release create "$tag" --title "Medusa $ver" \
              --notes "Automated build of $ver. See the commit log for changes." || true
          fi
          gh release upload "$tag" publish/*.lgx --clobber
          echo "attached $(ls publish | tr '\n' ' ')to $tag"
