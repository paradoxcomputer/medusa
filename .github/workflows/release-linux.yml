# Build the SELF-CONTAINED linux-amd64 Medusa apps (.lgx) in CI.
#
# The linux counterpart of release-macos.yml. Until now the linux .lgx was only ever produced
# by running module/scripts/make-release.sh by hand on a machine with Nix + Rust, which meant a
# release could not be cut without that machine. This builds the same artifacts on a GitHub
# runner so a tag produces BOTH variants.
#
# Output: a self-contained `linux-amd64` medusa_core (engine + sequencers + Tor + Tor-forward
# bundled under bin/) plus medusa_ui + tip_jar. These are merged with the darwin .lgx into the
# multi-variant packages served by the module catalog.
#
# Trigger: a release tag (v*) or manual dispatch, matching release-macos.yml.
name: release-linux

on:
  push:
    # "publish-<version>" re-runs just this job (mac is v* only), so the merge+upload step
    # below can be redone without paying for another macOS build.
    tags: ["v*", "publish-*"]
  workflow_dispatch:

permissions:
  contents: write   # upload the finished .lgx to the release
  actions: read     # pull the darwin artifact from the release-macos run

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOT ubuntu-latest: the image behind that label changes under us, and this job bundles
          # an apt package (tor) into a shipped artifact, so the base image is a release input.
          - runner: ubuntu-24.04
            variant: linux-amd64
    runs-on: ${{ matrix.runner }}
    env:
      # Pinned toolchain. Floating `stable` and an unversioned `cargo install` silently change
      # the compiler and the zkVM prover under the wallet engine between runs.
      RUST_TOOLCHAIN: "1.94.0"            # == wallet/.lez-build/rust-toolchain.toml
      RISC0_VERSION: "3.0.5"              # == risc0-zkvm in wallet/.lez-build/Cargo.lock
      # tor is installed into the SHIPPED medusa_core as bin/medusa-tor, so it is a release
      # artifact and not a build tool. Exact package version, asserted after install. Bump this
      # deliberately; a build that fails here is the control working.
      TOR_APT_VERSION: "0.4.8.10-1build2" # the only tor published for noble/amd64
      # sha256 of that binary. Empty = record it in PROVENANCE only. Fill this in from the first
      # pinned run's PROVENANCE file to turn it into a hard pre-bundle assertion.
      TOR_SHA256: ""
    steps:
      # Every `uses:` is pinned to a full commit sha with the tag in a trailing comment.
      # nix-installer-action was tracking @main: a branch on a third-party org that runs first
      # and installs the build system. The rest were on mutable major tags. Dependabot updates
      # sha pins fine.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }   # tags, for a reproducible engine build

      - name: Install Nix (flakes)
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # cargo-risczero is a ~30 minute source build, which dominated the first run's wall clock.
      # Cache the resulting binaries so retries start at the part that matters. The key names the
      # versions, so a pin bump cannot silently keep serving the old executables.
      - name: Cache risc0 toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-risczero
            ~/.cargo/bin/r0vm
          key: risc0-${{ runner.os }}-cargo-risczero-${{ env.RISC0_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}

      - name: Rust toolchain (+ risc0)
        run: |
          set -euo pipefail
          # Pinned, not `stable`. The LEZ tree's own rust-toolchain.toml already asks for this
          # version inside wallet/.lez-build; this pins the same compiler for the crates built
          # outside it (wallet/faucet/client, wallet/l1).
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          # A restored cache is untrusted input: revalidate the executable against the pin and
          # reinstall on any mismatch, rather than trusting whatever the cache handed back.
          if ! cargo risczero --version 2>/dev/null | grep -qF "$RISC0_VERSION"; then
            cargo install cargo-risczero --version "$RISC0_VERSION" --locked --force
          fi
          cargo risczero --version
          # NOTE: at risc0 3.x `cargo risczero install` only errors with "Run `rzup install`
          # instead" (risc0 v3.0.5, risc0/cargo-risczero/src/commands/install.rs), so it is a
          # no-op here. Kept and pinned for older RISC0_VERSION pins. The zkVM guest programs
          # this build needs are prebuilt .bin artifacts committed in the LEZ tree and included
          # by build_utils::include_artifacts, so nothing compiles a guest on this runner.
          cargo risczero install --version "$RISC0_VERSION" || true

      - name: Build the LEZ engine (patched v0.2.4 source, v0.2.2 program generation)
        run: |
          # wallet/build.sh replays the patch series with `git am`, which refuses to run without a
          # committer identity. GitHub's ubuntu image ships none, so set one for this checkout.
          git config --global user.name  "medusa build"
          git config --global user.email "build@medusa.local"
          # clones the pinned logos-execution-zone commit (tag v0.2.4), applies wallet/patches-v022/*, builds:
          #   wallet (→ wallet-lez), sequencer_service (standalone), sequencer_service_l1 (L1),
          #   diaphani-forward (Tor forwarder).
          # the patch series keeps the `keycard` cargo feature OFF, so the wallet links no
          # libpython - see the linkage assertion below.
          bash wallet/build.sh
          echo "LEZ=$PWD/wallet/.lez-build/target/release"     >> "$GITHUB_ENV"
          echo "DIA=$PWD/wallet/.diaphani-build/target/release" >> "$GITHUB_ENV"

      - name: Assert the engine has no build-host Python dependency
        run: |
          set -euo pipefail
          # medusa#1: wallet-lez used to link the build host's libpython and died at load time
          # on every other machine. Fail the build here rather than shipping that again.
          for b in wallet sequencer_service sequencer_service_l1; do
            out=$(readelf -d "$LEZ/$b" || true)
            case "$out" in
              *libpython*) echo "ERROR: $b links libpython - keycard feature leaked back in"; exit 1 ;;
            esac
          done
          echo "ok: no libpython in the engine binaries"

      - name: Build module .lgx (native linux, self-contained .so)
        run: |
          set -euo pipefail
          out="$PWD/lin-out"; mkdir -p "$out"
          ( cd module                   && nix build .#lgx-portable -o result-portable ); cp module/result-portable/*.lgx                   "$out/medusa_core.lgx"
          ( cd module/plugins/medusa_ui && nix build .#lgx-portable -o result-portable ); cp module/plugins/medusa_ui/result-portable/*.lgx "$out/medusa_ui.lgx"
          ( cd examples/tip-jar         && nix build .#lgx-portable -o result-portable ); cp examples/tip-jar/result-portable/*.lgx         "$out/tip_jar.lgx"
          echo "LINOUT=$out" >> "$GITHUB_ENV"

      - name: Obtain the lgx CLI (built as a nix dep; pin against GC)
        run: |
          drv=$(ls -t /nix/store/*-lgx-0.1.0.drv | grep -vE 'logos|module' | head -1)
          nix-store --realise "$drv" --add-root "$PWD/lgx-cli" >/dev/null
          echo "LGX=$PWD/lgx-cli/bin/lgx" >> "$GITHUB_ENV"

      - name: Bundle the engine into every linux variant of medusa_core
        run: |
          set -euo pipefail
          mc="$LINOUT/medusa_core.lgx"
          cp "$mc" medusa_core-selfcontained.lgx; chmod u+w medusa_core-selfcontained.lgx

          # Bundle Tor once so the Paradox·Tor zone works with no external install
          # (make-release.sh does the same). This binary is SHIPPED, so it is pinned to an exact
          # package version, asserted after install, and its sha256 recorded into PROVENANCE
          # (and asserted, once TOR_SHA256 is filled in). Fail closed: this used to be `|| true`,
          # which silently published a medusa_core with no Tor in it.
          sudo apt-get update -qq
          sudo apt-get install -y -qq "tor=$TOR_APT_VERSION"
          got_tor="$(dpkg-query -W -f='${Version}' tor)"
          [ "$got_tor" = "$TOR_APT_VERSION" ] || {
            echo "ERROR: installed tor is $got_tor, expected $TOR_APT_VERSION"; exit 1; }
          tor_bin="$(readlink -f "$(command -v tor)")"
          tor_sha="$(sha256sum "$tor_bin" | cut -d' ' -f1)"
          echo "bundling tor $got_tor  sha256=$tor_sha  ($tor_bin)"
          if [ -n "${TOR_SHA256:-}" ] && [ "$tor_sha" != "${TOR_SHA256}" ]; then
            echo "ERROR: tor sha256 $tor_sha does not match the pinned ${TOR_SHA256}"; exit 1
          fi
          echo "TOR_BIN=$tor_bin" >> "$GITHUB_ENV"

          # Every linux variant the nix build emitted, not just linux-amd64. The Nix DEV build of
          # Basecamp only loads "-dev" variants (see module/scripts/install-dev.sh), so bundling
          # the engine into linux-amd64 alone would ship those users a plugin with no engine
          # under bin/ and every wallet op would fail "wallet CLI not found".
          variants=$(python3 - "$mc" <<'PY'
          import sys,gzip,io,tarfile
          tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()))
          vs={p[1] for p in (m.name.split('/') for m in tf.getmembers())
              if len(p) > 2 and p[0] == 'variants' and p[1].startswith('linux-')}
          print('\n'.join(sorted(vs)))
          PY
          )
          [ -n "$variants" ] || { echo "ERROR: no linux variants found in $mc"; exit 1; }
          echo "bundling engine into:" $variants

          for v in $variants; do
            stg="$PWD/mc-stage-$v"; mkdir -p "$stg/bin"
            # extract this variant's payload (the .so + its bundled libs)
            python3 - "$mc" "$stg" "$v" <<'PY'
          import sys,gzip,io,tarfile,os
          src,stg,var=sys.argv[1],sys.argv[2],sys.argv[3]; pre=f"variants/{var}/"
          tf=tarfile.open(fileobj=io.BytesIO(gzip.open(src,'rb').read()))
          for m in tf.getmembers():
              if m.name.startswith(pre) and not m.isdir():
                  dst=os.path.join(stg,m.name[len(pre):]); os.makedirs(os.path.dirname(dst) or '.',exist_ok=True)
                  open(dst,'wb').write(tf.extractfile(m).read())
          PY
            # engine binaries under bin/ (resolveBin looks at <module>/bin/<name> first):
            install -m755 "$LEZ/wallet"                     "$stg/bin/wallet-lez"
            install -m755 module/scripts/wallet-wrapper      "$stg/bin/wallet"
            install -m755 "$LEZ/sequencer_service"           "$stg/bin/sequencer_service"
            install -m755 "$LEZ/sequencer_service_l1"        "$stg/bin/sequencer_service_l1"
            # No `|| true` here: wallet/build.sh now fails closed if the pinned diaphani commit
            # cannot be checked out, so a missing binary means the pin check was bypassed.
            install -m755 "$DIA/diaphani-forward"            "$stg/bin/diaphani-forward"
            install -m755 module/scripts/medusa-tor-monitor  "$stg/bin/medusa-tor-monitor"
            install -m755 "$tor_bin"                         "$stg/bin/medusa-tor"
            # medusa-faucet-client, built by the same wallet/build.sh run as the engine above. It
            # is required by TWO paths, not one: the on-chain token faucet, and the wrapper's
            # `init-holding` bootstrap, which is the only way to shield a token held in an ATA (a
            # PDA cannot sign a private send). Every release before 0.4.0 shipped without it, so
            # Shield failed on every claimed token.
            install -m755 wallet/faucet/client/target/release/medusa-faucet-client \
                                                             "$stg/bin/medusa-faucet-client"
            # The risc0 guest is NOT built on this runner (it needs the docker risc0 toolchain);
            # bundle the committed artifact when there is one. Without it only the on-chain faucet
            # CLAIM is affected, and it reports the absence rather than failing obscurely.
            if [ -f wallet/faucet/guest/medusa_faucet.bin ]; then
              install -m644 wallet/faucet/guest/medusa_faucet.bin "$stg/bin/medusa_faucet.bin"
            else
              echo "::warning::medusa_faucet.bin not in the tree - the on-chain token faucet will report it missing"
            fi
            mainfile=$(basename "$(ls "$stg"/*.so 2>/dev/null || ls "$stg"/*plugin* | head -1)")
            "$LGX" add medusa_core-selfcontained.lgx -v "$v" -f "$stg" --main "$mainfile" -y
          done
          "$LGX" verify medusa_core-selfcontained.lgx

          # Guard the regression this step exists to prevent: every linux variant must carry the
          # engine, or a whole class of Basecamp install silently gets a wallet-less module.
          python3 - medusa_core-selfcontained.lgx <<'PY'
          import sys,gzip,io,tarfile
          tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()))
          names=[m.name for m in tf.getmembers()]
          vs={n.split('/')[1] for n in names
              if n.startswith('variants/') and len(n.split('/')) > 2 and n.split('/')[1].startswith('linux-')}
          bad=[v for v in vs if f"variants/{v}/bin/wallet-lez" not in names]
          if bad:
              sys.exit("ERROR: linux variants missing bin/wallet-lez: %s" % ", ".join(sorted(bad)))
          print("ok: engine bundled into", ", ".join(sorted(vs)))
          PY

      - name: Collect artifacts
        run: |
          dst="$PWD/artifacts"; mkdir -p "$dst"
          cp medusa_core-selfcontained.lgx "$dst/medusa_core-${{ matrix.variant }}.lgx"
          cp "$LINOUT"/medusa_ui.lgx "$dst/medusa_ui-${{ matrix.variant }}.lgx"
          cp "$LINOUT"/tip_jar.lgx   "$dst/tip_jar-${{ matrix.variant }}.lgx"
          ls -la "$dst"

      # Without this, identifying which engine a published .lgx contains means fingerprinting a
      # risc0 circuit source path inside the binary. Record the upstream commit, every patch's
      # sha256 and every artifact's sha256 instead.
      - name: Record provenance
        run: |
          set -euo pipefail
          bash scripts/gen-provenance.sh "$PWD/PROVENANCE.txt" artifacts
          cp PROVENANCE.txt "artifacts/PROVENANCE-${{ matrix.variant }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-lgx-${{ matrix.variant }}
          path: |
            artifacts/*.lgx
            artifacts/PROVENANCE-*.txt

      # Merge with the darwin build and publish, so a release needs no local tooling. The linux
      # runner already has the lgx CLI from the step above, and macOS cannot be built here, so
      # this side does the merge: pull the newest successful release-macos artifact, merge each
      # package into one multi-variant .lgx, and attach it to the release.
      - name: Merge with darwin and attach the .lgx to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json;print(json.load(open('module/modules/medusa_core/manifest.json'))['version'])")
          tag="v$ver"
          echo "release tag: $tag"

          # Bound to THIS commit. Without --commit this took the newest successful release-macos
          # run on any ref, so a workflow_dispatch from any branch could feed darwin binaries
          # into the published multi-variant .lgx as long as the version string happened to
          # match. The version guard below is kept as a second check, not the only one.
          mac_run=$(gh run list --workflow release-macos.yml --status success \
                      --commit "$GITHUB_SHA" \
                      --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -z "$mac_run" ]; then
            echo "::warning::no successful release-macos run for commit $GITHUB_SHA - publishing linux-only packages"
            echo "::warning::(macOS builds on v* tags only; a publish-* tag must point at the same commit)"
          else
            echo "merging with darwin artifacts from run $mac_run"
            mkdir -p macdl && gh run download "$mac_run" -D macdl
          fi

          # lgx merge requires every manifest field except `main` to match, so a darwin artifact
          # from an older release cannot be merged into this one. Detect that here and say so,
          # rather than letting merge fail with a field-by-field diff.
          macver=""
          if [ -n "$mac_run" ]; then
            maccore=$(find macdl -name "medusa_core-darwin-*.lgx" | head -1 || true)
            if [ -n "$maccore" ]; then
              macver=$(python3 -c "import sys,gzip,io,tarfile,json;tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()));print(json.load(tf.extractfile('manifest.json'))['version'])" "$maccore")
              echo "darwin artifact version: $macver (this build: $ver)"
              if [ "$macver" != "$ver" ]; then
                echo "::error::darwin artifacts are v$macver but this build is v$ver."
                echo "::error::Push tag v$ver to rebuild macOS, then re-run this workflow."
                exit 1
              fi
            fi
          fi

          mkdir -p publish

          # Give every variant its "-dev" twin, then verify the package.
          #
          # Basecamp resolves variants by name and accepts exactly one spelling:
          # package_manager_lib.cpp::platformVariantsToTry() REPLACES its candidate list with
          # the "<platform>-dev" forms unless the host was compiled with LGPM_PORTABLE_BUILD.
          # So a package carrying only linux-amd64 + darwin-arm64 installs on the AppImage and
          # fails on every build from source with
          #   "Package does not contain variant for platform: linux-x86_64-dev".
          # The payload is identical either way - .#lgx-portable is self-contained ($ORIGIN
          # only, Qt from the host) - so one tree serves both names. The real .#lgx dev bundle
          # cannot be shipped instead: its RUNPATH points at the builder's /nix/store, which no
          # other machine has. Idempotent: a variant that already has a twin is left alone.
          alias_dev() {
            pkgfile="$1"
            work=$(mktemp -d)
            python3 - "$pkgfile" > "$work/plan" <<'ALIASPY'
          import json, sys, tarfile
          m = json.load(tarfile.open(sys.argv[1]).extractfile("manifest.json"))
          have = {k.split("/", 1)[1] for k in m.get("hashes", {}) if k.startswith("variants/")}
          view = m.get("view", "") or "-"
          main = m.get("main", {})
          if isinstance(main, str):
              main = {v: main for v in have}
          for v in sorted(have):
              if v.endswith("-dev") or f"{v}-dev" in have:
                  continue
              print(v, main.get(v) or "-", view)
          ALIASPY
            if [ -s "$work/plan" ]; then
              "$LGX" extract "$pkgfile" -o "$work/ex" >/dev/null
              while read -r v vmain vview; do
                echo "  $(basename "$pkgfile"): $v -> ${v}-dev"
                args=(--variant "${v}-dev" --files "$work/ex/$v" -y)
                # `cmd && arr+=(...)` would be the whole command, so an empty field would
                # return 1 and set -e would kill the job. Use if/fi.
                if [ "$vmain" != "-" ]; then args+=(--main "$vmain"); fi
                if [ "$vview" != "-" ]; then args+=(--view "$vview"); fi
                "$LGX" add "$pkgfile" "${args[@]}"
              done < "$work/plan"
            fi
            rm -rf "$work"
            "$LGX" verify "$pkgfile"
            # A package whose variants lack -dev twins cannot be installed by a build from
            # source at all, so fail the release rather than publish one.
            python3 - "$pkgfile" <<'TWINPY'
          import json, sys, tarfile
          m = json.load(tarfile.open(sys.argv[1]).extractfile("manifest.json"))
          have = {k.split("/", 1)[1] for k in m.get("hashes", {}) if k.startswith("variants/")}
          plain = {v for v in have if not v.endswith("-dev")}
          missing = sorted(v for v in plain if v + "-dev" not in have)
          assert plain, "no platform variants at all"
          assert not missing, f"variants without a -dev twin: {missing}"
          print("  variant pairs OK:", sorted(have))
          TWINPY
          }

          # Read the single architecture out of a one-platform artifact.
          arch_of() {
            python3 -c "import sys,gzip,io,tarfile,json;tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()));m=json.load(tf.extractfile('manifest.json'));print(sorted(k.split('/',1)[1] for k in m['hashes'] if k.startswith('variants/'))[0])" "$1"
          }

          for pkg in medusa_core medusa_ui tip_jar; do
            lin="artifacts/$pkg-${{ matrix.variant }}.lgx"
            [ -f "$lin" ] || { echo "::warning::$lin missing, skipping"; continue; }
            mac=$(find macdl -name "$pkg-darwin-*.lgx" 2>/dev/null | head -1 || true)
            # name each file after ITS OWN manifest version, so the catalog's generated index
            # never advertises a version that disagrees with the package it points at
            pkgver=$(python3 -c "import sys,gzip,io,tarfile,json;tf=tarfile.open(fileobj=io.BytesIO(gzip.open(sys.argv[1],'rb').read()));print(json.load(tf.extractfile('manifest.json'))['version'])" "$lin")
            out="publish/$pkg-$pkgver.lgx"
            if [ -n "$mac" ]; then
              "$LGX" merge "$lin" "$mac" -o "$out" -y
            else
              cp "$lin" "$out"
            fi
            alias_dev "$out"

            # Also publish ONE FILE PER ARCHITECTURE, alongside the merged package.
            #
            # The catalog carries a single url per version and package_downloader has no
            # platform awareness, so a catalog install always pulls EVERY architecture. That
            # matters because Basecamp abandons a download after 300s - kDownloadIpcDeadlineMs
            # in PackageCoordinator.cpp, which wraps the whole batch, so curl's own 600s cap
            # never fires - and there is no resume: a failed attempt restarts at byte 0.
            # Merged medusa_core is far past that budget on an ordinary connection, and worse,
            # a timeout is reported to the user as a SUCCESSFUL install.
            # These single-architecture files are about half the size and are meant for the
            # "Install LGX Package" path, which reads from disk and so has no download timeout.
            for part in "$lin" "$mac"; do
              [ -n "$part" ] || continue
              [ -f "$part" ] || continue
              pv=$(arch_of "$part")
              pout="publish/$pkg-$pkgver-$pv.lgx"
              cp "$part" "$pout"
              chmod u+w "$pout"
              alias_dev "$pout"
            done
          done
          ls -la publish

          # Provenance for exactly what users download: the merged, published packages.
          bash scripts/gen-provenance.sh "$PWD/PROVENANCE-$ver.txt" publish
          cp "PROVENANCE-$ver.txt" "publish/PROVENANCE-$ver.txt"

          # Create the release if it does not exist yet, so cutting one needs no manual step.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "creating release $tag"
            gh release create "$tag" --title "Medusa $ver" \
              --notes "Automated build of $ver. See the commit log for changes." || true
          fi
          gh release upload "$tag" publish/*.lgx "publish/PROVENANCE-$ver.txt" --clobber
          echo "attached $(ls publish | tr '\n' ' ')to $tag"
